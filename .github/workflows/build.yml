name: Build TgMini

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Build app (PyInstaller)
        run: >
          python -m PyInstaller --noconfirm --clean --onedir --noconsole --name TgMini
          --icon icon.ico --add-data "plugins;plugins"
          --hidden-import socks --collect-submodules telethon tgmini.py

      - name: Portable zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force portable/TgMini | Out-Null
          Copy-Item -Recurse -Force dist/TgMini/* portable/TgMini/
          New-Item portable/TgMini/portable.flag -ItemType File | Out-Null
          Copy-Item portable_readme.txt portable/TgMini/README.txt
          Compress-Archive -Force -Path portable/TgMini -DestinationPath TgMini-Portable.zip

      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer.iss

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: TgMini build ${{ github.run_number }}
          body: |
            - TgMini-Setup.exe: установщик (удаляется без следов)
            - TgMini-Portable.zip: портативная версия (распаковать и запустить)
          files: |
            TgMini-Portable.zip
            installer/TgMini-Setup.exe
